title: Scheduled Task Created via schtasks.exe
id: 9e3b6d14-5a07-4c2f-8d19-7b4a0e6c3d03
status: experimental
description: Detects creation of a scheduled task with schtasks.exe /create. Written from lab testing of a manually created task.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Daniel Guy
date: 2026-10-11
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.execution
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: ' /create'
    condition: selection
falsepositives:
    - Software installers and updaters that register scheduled tasks
    - Administrators creating maintenance tasks
level: low
