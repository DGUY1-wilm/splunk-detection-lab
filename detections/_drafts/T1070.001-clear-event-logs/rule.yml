title: Windows Event Log Cleared with wevtutil
id: d5a1f830-7e29-4b64-8c13-0a9e2b6d4f07
status: experimental
description: DRAFT, untested. Detects wevtutil.exe clearing an event log.
references:
    - https://attack.mitre.org/techniques/T1070/001/
author: Daniel Guy
date: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1070.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\wevtutil.exe'
    selection_cmd:
        CommandLine|contains:
            - ' cl '
            - 'clear-log'
    condition: selection_img and selection_cmd
falsepositives:
    - Administrators clearing logs during maintenance
level: high
