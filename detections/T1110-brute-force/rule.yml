title: Burst of Failed Logons from One Host (Password Guessing)
id: 7d1f4b36-2c80-4e59-9f6a-8b3a1c5e7d05
status: experimental
description: Five or more failed logons on one host within 5 minutes. Written from lab testing of a manual password-guessing simulation.
references:
    - https://attack.mitre.org/techniques/T1110/001/
author: Daniel Guy
date: 2026-10-11
tags:
    - attack.credential_access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - failed_logon_4625
    group-by:
        - Computer
    timespan: 5m
    condition:
        gte: 5
falsepositives:
    - Users mistyping passwords, expired or changed credentials
    - Misconfigured services or scheduled tasks using stale passwords
level: medium
