# Splunk Universal Forwarder inputs (Windows victim VM)
# Path on the VM: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Index names must already exist in Splunk (Settings > Indexes).

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
renderXml = true
index = sysmon

[WinEventLog://Security]
disabled = 0
index = wineventlog

[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = wineventlog
